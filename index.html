<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5, user-scalable=no">
<meta name="theme-color" content="#0a0808">
<meta name="color-scheme" content="dark">
<title>HairOS Pin Composer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Inter:wght@300;400;500;600&family=Poppins:wght@300;400;600&family=Montserrat:wght@300;400;600&family=Raleway:wght@300;400;600&family=Josefin+Sans:wght@300;400;600&family=Quicksand:wght@300;400;600&family=Oswald:wght@300;400;600&family=Lora:wght@400;600&family=Cormorant+Garamond:wght@300;400;600&family=DM+Serif+Display&family=Abril+Fatface&family=Bebas+Neue&family=Dancing+Script:wght@400;600&family=Pacifico&family=Great+Vibes&family=Caveat:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0808;
  --bg-card:#1a1612;
  --bg-elevated:#221d18;
  --text:#f5f0ea;
  --text-sec:#ddd0c0;
  --text-muted:#a89e93;
  --gold:#d9bb90;
  --gold-light:#edd4ac;
  --gold-hi:#fdf1d4;
  --gold-lo:#9b8363;
  --border:rgba(217,187,144,.10);
  --border-gold:rgba(217,187,144,.28);
  --radius:14px;
  --ease-luxury:cubic-bezier(.23,1,.32,1);
  --ease-out:cubic-bezier(.22,1,.36,1);
  --tr-ui:background-color .3s var(--ease-out),border-color .3s var(--ease-out),color .3s var(--ease-out),box-shadow .3s var(--ease-out),transform .3s var(--ease-out),opacity .3s var(--ease-out);
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);--safe-r:env(safe-area-inset-right,0px);
  --ratio: 2/3;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:Inter,system-ui,sans-serif;
  overscroll-behavior:none;-webkit-text-size-adjust:100%;
  -webkit-font-smoothing:antialiased;
}

.app{display:flex;flex-direction:column;min-height:100dvh;padding:calc(10px + var(--safe-t)) calc(12px + var(--safe-r)) calc(10px + var(--safe-b)) calc(12px + var(--safe-l));gap:12px;max-width:1600px;margin:0 auto}

.stage{
  position:sticky;top:0;z-index:20;display:flex;flex-direction:column;align-items:center;gap:10px;
  background:var(--bg);padding:10px 0 12px;margin:0 -12px;padding-left:12px;padding-right:12px;
  box-shadow:0 4px 20px -5px rgba(0,0,0,.6);
}

.title{
  margin:0;font-family:'Playfair Display',serif;font-style:italic;
  font-weight:600;font-size:1.15rem;color:var(--gold-light);
  text-align:center;letter-spacing:-.01em;
}
.title small{display:block;font-family:Inter,sans-serif;font-style:normal;font-weight:400;font-size:.62rem;letter-spacing:.22em;text-transform:uppercase;color:var(--text-muted);margin-top:4px}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;width:100%}

button,.file{
  padding:10px 14px;min-height:40px;border-radius:999px;border:1px solid var(--border-gold);
  background:rgba(26,22,18,.66);color:var(--gold-light);cursor:pointer;font-size:.78rem;
  font-family:inherit;font-weight:500;letter-spacing:.03em;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  transition:var(--tr-ui);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  touch-action:manipulation;
}
button:active,.file:active{transform:scale(.97)}
button:hover,.file:hover{background:rgba(217,187,144,.14);border-color:var(--gold);color:var(--gold-hi)}

button.primary{
  background:linear-gradient(145deg,var(--gold-hi),#edd4ac 32%,#ceaf84 64%,var(--gold-lo));
  color:#1b1209;border-color:var(--gold-light);font-weight:600;
  box-shadow:0 0 16px rgba(255,211,128,.18),inset 0 1px 0 rgba(255,255,255,.2);
}
button.primary:hover{
  background:linear-gradient(145deg,#fff5dc,#f0d9b1 32%,#d4b58a 64%,#a89070);
  color:#000;box-shadow:0 0 22px rgba(255,211,128,.3);
}

canvas{
  width:100%;max-width:min(100%,340px);height:auto;aspect-ratio:var(--ratio);
  border:1px solid var(--border-gold);background:#fff;border-radius:var(--radius);
  box-shadow:0 8px 28px rgba(0,0,0,.5),0 0 40px rgba(217,187,144,.06);
  touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;
  transition:aspect-ratio .4s var(--ease-out);
}
canvas:active{cursor:grabbing}

.panel{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px 14px;width:100%}
label{font-size:.7rem;display:flex;flex-direction:column;gap:4px;color:var(--text-sec);letter-spacing:.02em}
label.small{font-size:.62rem}

input[type=text],select{
  padding:9px 10px;border:1px solid var(--border);background:rgba(0,0,0,.3);
  color:var(--text);border-radius:10px;font-size:.85rem;width:100%;font-family:inherit;height:38px;
  transition:var(--tr-ui);
}
input[type=text]:focus,select:focus{outline:none;border-color:var(--border-gold);background:rgba(0,0,0,.5);box-shadow:0 0 0 3px rgba(217,187,144,.12)}

input[type=color]{
  width:100%;height:38px;border:1px solid var(--border);border-radius:10px;
  background:rgba(0,0,0,.3);padding:3px;cursor:pointer;
}

input[type=range]{
  width:100%;height:24px;background:transparent;cursor:pointer;
  -webkit-appearance:none;appearance:none;margin-top:2px;
}
input[type=range]::-webkit-slider-runnable-track{height:4px;background:rgba(217,187,144,.18);border-radius:2px}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;width:18px;height:18px;border-radius:50%;
  background:var(--gold-light);border:2px solid var(--gold-hi);margin-top:-7px;
  box-shadow:0 0 0 3px rgba(217,187,144,.2),0 2px 6px rgba(0,0,0,.4);
}
input[type=range]::-moz-range-track{height:4px;background:rgba(217,187,144,.18);border-radius:2px}
input[type=range]::-moz-range-thumb{
  width:16px;height:16px;border-radius:50%;background:var(--gold-light);
  border:2px solid var(--gold-hi);box-shadow:0 0 0 3px rgba(217,187,144,.2);
}

h4{
  margin:8px 0 0;font-family:'Playfair Display',serif;font-style:italic;
  font-weight:600;font-size:.85rem;color:var(--gold);
  letter-spacing:.01em;grid-column:1/-1;
  border-top:1px solid var(--border-gold);padding-top:14px;
}
h4:first-child{border-top:none;padding-top:0;margin-top:0}

#zreset{
  padding:8px 14px;font-size:.72rem;height:34px;align-self:flex-end;grid-column:1/-1;
  background:transparent;border-style:dashed;
}
#rs{
  margin-top:14px;background:transparent;color:#e8a0a8;border-color:rgba(184,58,74,.55);
  grid-column:1/-1;justify-self:center;width:100%;max-width:220px;
}
#rs:hover{background:rgba(184,58,74,.25);color:#f5c8ce;border-color:#b83a4a}

/* SEGMENTED CONTROL DE PROPORÇÃO */
.ratio-group{
  display:flex;gap:6px;flex-wrap:wrap;grid-column:1/-1;
  padding:6px;background:rgba(0,0,0,.25);border-radius:12px;border:1px solid var(--border);
}
.ratio-btn{
  flex:1;min-width:60px;padding:8px 6px;border-radius:8px;
  background:transparent;border:1px solid transparent;color:var(--text-muted);
  font-size:.72rem;font-weight:500;cursor:pointer;transition:var(--tr-ui);
  display:flex;flex-direction:column;align-items:center;gap:3px;
}
.ratio-btn small{font-size:.6rem;opacity:.7;letter-spacing:.05em}
.ratio-btn:hover{background:rgba(217,187,144,.08);color:var(--gold-light)}
.ratio-btn.ativo{
  background:rgba(217,187,144,.16);border-color:var(--border-gold);
  color:var(--gold-hi);font-weight:600;
  box-shadow:0 0 12px rgba(217,187,144,.15);
}
.ratio-btn.ativo small{opacity:1;color:var(--gold)}

@media (min-width: 700px){
  canvas{max-width:min(100%,420px)}
  .panel{grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px 16px}
}
@media (min-width: 960px){
  .app{display:grid;grid-template-columns:minmax(340px,440px) minmax(400px,1fr);align-items:start;height:100dvh;overflow:hidden;gap:20px;padding:20px}
  .stage{position:sticky;top:0;align-self:start;margin:0;padding:0;box-shadow:none;max-height:100dvh}
  canvas{max-width:100%}
  .side{height:100%;overflow-y:auto;padding-right:6px;overscroll-behavior:contain}
  .panel{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
  #rs{justify-self:start;max-width:180px;margin-top:24px}
  .side::-webkit-scrollbar{width:6px}
  .side::-webkit-scrollbar-track{background:transparent}
  .side::-webkit-scrollbar-thumb{background:rgba(217,187,144,.2);border-radius:3px}
}

#hint{display:none;font-size:.72rem;text-align:center;max-width:420px;color:var(--text-muted);line-height:1.5}
#out{display:none;max-width:100%;border:1px solid var(--border-gold);border-radius:var(--radius);box-shadow:0 8px 24px rgba(0,0,0,.5)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div class="app">

  <div class="stage">
    <h3 class="title">HairOS Pin Composer<small>1000 × 1500 · Pin</small></h3>
    <div class="toolbar">
      <label class="file">📷 Escolher foto<input id="f" type="file" accept="image/*" hidden></label>
      <button id="dl" class="primary">Baixar</button>
      <button id="sh2">Compartilhar</button>
    </div>
    <canvas id="c" width="1000" height="1500"></canvas>
    <div id="hint">Imagem final. Se o download não funcionar, clique com o botão direito (ou toque e segure) nela e salve:</div>
    <img id="out" alt="Imagem final">
  </div>

  <div class="side">
    <div class="panel">
      <h4>Proporção da Imagem</h4>
      <div class="ratio-group" id="ratioGroup">
        <button type="button" class="ratio-btn" data-ratio="1:1" data-w="1000" data-h="1000">1:1<small>Quadrado</small></button>
        <button type="button" class="ratio-btn ativo" data-ratio="2:3" data-w="1000" data-h="1500">2:3<small>Pin</small></button>
        <button type="button" class="ratio-btn" data-ratio="3:4" data-w="1080" data-h="1440">3:4<small>Retrato</small></button>
        <button type="button" class="ratio-btn" data-ratio="4:5" data-w="1080" data-h="1350">4:5<small>Feed</small></button>
        <button type="button" class="ratio-btn" data-ratio="9:16" data-w="1080" data-h="1920">9:16<small>Stories</small></button>
      </div>

      <h4>Foto (Arraste e faça Pinça)</h4>
      <label>Zoom (0.5× – 5×)<input id="z" type="range" min="0.5" max="5" step="0.01" value="1"></label>
      <label>Horizontal<input id="x" type="range" min="-3" max="3" step="0.01" value="0"></label>
      <label>Vertical<input id="y" type="range" min="-3" max="3" step="0.01" value="0"></label>
      <button id="zreset" type="button">↺ Resetar zoom e posição</button>

      <h4>Texto</h4>
      <label style="grid-column:1/-1">Texto<input id="t" type="text" value="Bob texturizado · 2B/3A"></label>
      <label>Fonte
        <select id="ff">
          <optgroup label="Sans-serif"><option>Inter</option><option>Poppins</option><option>Montserrat</option><option>Raleway</option><option>Josefin Sans</option><option>Quicksand</option><option>Oswald</option><option>Bebas Neue</option></optgroup>
          <optgroup label="Serifadas"><option>Playfair Display</option><option>Lora</option><option>Cormorant Garamond</option><option>DM Serif Display</option><option>Abril Fatface</option></optgroup>
          <optgroup label="Manuscritas"><option>Dancing Script</option><option>Pacifico</option><option>Great Vibes</option><option>Caveat</option></optgroup>
        </select>
      </label>
      <label>Peso<select id="fw"><option value="300">Light</option><option value="400" selected>Regular</option><option value="600">Bold</option></select></label>
      <label>Caixa<select id="cs"><option value="n">Normal</option><option value="u">MAIÚSCULAS</option></select></label>
      <label>Cor do texto<input id="col" type="color" value="#fbfaf7"></label>

      <label>Tamanho<input id="fs" type="range" min="24" max="140" step="1" value="58"></label>
      <label>Posição vertical<input id="ty" type="range" min="5" max="98" step="0.5" value="90"></label>
      <label>Espaçamento<input id="ls" type="range" min="0" max="20" step="0.5" value="0"></label>
      <label>Sombra<input id="sh" type="range" min="0" max="40" step="1" value="14"></label>

      <h4>Logo</h4>
      <label class="file" style="grid-column:1/-1;background:rgba(0,0,0,.3);padding:10px;text-align:center;border-radius:10px;cursor:pointer;border-style:dashed">
        Subir imagem do Logo
        <input id="logoFile" type="file" accept="image/*" hidden>
      </label>
      <label>Cor do logo
        <select id="lg">
          <option value="none" selected>Original</option>
          <option value="white">Branco</option>
          <option value="black">Preto</option>
        </select>
      </label>
      <label>Visibilidade
        <select id="lvis">
          <option value="on" selected>Ligado</option>
          <option value="off">Desligado</option>
        </select>
      </label>
      <label>Tamanho<input id="lw" type="range" min="80" max="700" step="1" value="260"></label>
      <label>Horizontal<input id="lx" type="range" min="0" max="100" step="0.5" value="50"></label>
      <label>Vertical<input id="ly" type="range" min="0" max="100" step="0.5" value="5"></label>

      <button id="rs" type="button">Limpar tudo</button>
    </div>
  </div>

</div>

<script>
const c=document.getElementById('c'),g=c.getContext('2d');
const $=id=>document.getElementById(id);

const state={
  zoom:1, ox:0, oy:0,
  text:'Bob texturizado · 2B/3A',
  font:'Inter', weight:'400', size:58, ty:90, ls:0, shadow:14,
  color:'#fbfaf7', upper:false,
  logo:'none', lvis:'on', lw:260, lx:50, ly:5,
  W:1000, H:1500, ratio:'2:3'
};
let img=null;
let logoImg=null;

function drawSoon(){
  requestAnimationFrame(draw);
}

function wrapText(ctx,text,maxW){
  const words=text.split(' ');const lines=[];let cur='';
  for(const w of words){
    const test=cur?cur+' '+w:w;
    if(ctx.measureText(test).width>maxW&&cur){lines.push(cur);cur=w;}
    else cur=test;
  }
  if(cur)lines.push(cur);
  return lines;
}

async function draw(){
  try{await document.fonts.load(state.weight+' 50px "'+state.font+'"');}catch(e){}
  const W=state.W, H=state.H;
  g.clearRect(0,0,W,H);
  g.fillStyle='#fff';g.fillRect(0,0,W,H);

  if(img){
    const s=Math.max(W/img.width,H/img.height)*state.zoom;
    const iw=img.width*s,ih=img.height*s;
    const dx=(W-iw)/2+state.ox*(iw-W)/2;
    const dy=(H-ih)/2+state.oy*(ih-H)/2;
    g.drawImage(img,dx,dy,iw,ih);
  }else{
    g.fillStyle='#f0efec';g.fillRect(0,0,W,H);
    g.fillStyle='#aaa';g.font='300 '+Math.round(W*0.036)+'px Inter,sans-serif';g.textAlign='center';g.textBaseline='middle';
    g.fillText('Escolha uma foto',W/2,H/2);
  }

  if(logoImg && state.lvis==='on'){
    const lw=state.lw;
    const lh=lw * (logoImg.naturalHeight / logoImg.naturalWidth);
    g.save();
    if(state.logo === 'white') g.filter = 'brightness(0) invert(1)';
    if(state.logo === 'black') g.filter = 'brightness(0)';
    g.drawImage(logoImg, (W-lw)*state.lx/100, (H-lh)*state.ly/100, lw, lh);
    g.restore();
  }

  let txt=state.upper?state.text.toUpperCase():state.text;
  if(!txt)return;
  let size=state.size;
  g.save();
  g.textAlign='center';g.textBaseline='middle';g.fillStyle=state.color;
  const set=()=>{g.font=state.weight+' '+size+'px "'+state.font+'", sans-serif';if('letterSpacing' in g)g.letterSpacing=state.ls+'px';};
  set();
  const maxW = W * 0.92;
  while(g.measureText(txt).width>maxW&&size>16){size-=2;set();}
  const lines=wrapText(g,txt,maxW);
  const lineH=size*1.15;
  const totalH=lines.length*lineH;
  const baseY=H*state.ty/100-(totalH-lineH)/2;
  if(state.shadow>0){g.shadowColor='rgba(0,0,0,.4)';g.shadowBlur=state.shadow;g.shadowOffsetY=2;}
  lines.forEach((ln,i)=>g.fillText(ln,W/2+state.ls/2,baseY+i*lineH));
  g.restore();
}

const bindings=[['z','zoom'],['x','ox'],['y','oy'],['t','text'],['ff','font'],['fw','weight'],['fs','size'],['ty','ty'],['ls','ls'],['sh','shadow'],['col','color'],['lg','logo'],['lvis','lvis'],['lw','lw'],['lx','lx'],['ly','ly']];
bindings.forEach(([id,key])=>{
  const el=$(id);
  el.addEventListener('input',()=>{
    state[key]=el.type==='range'?+el.value:el.value;
    drawSoon();
  });
});
$('cs').addEventListener('input',()=>{state.upper=$('cs').value==='u';drawSoon();});

/* ===== SELETOR DE PROPORÇÃO ===== */
document.querySelectorAll('.ratio-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.ratio-btn').forEach(b=>b.classList.remove('ativo'));
    btn.classList.add('ativo');
    const w = +btn.dataset.w;
    const h = +btn.dataset.h;
    const ratio = btn.dataset.ratio;
    state.W = w; state.H = h; state.ratio = ratio;
    c.width = w; c.height = h;
    document.documentElement.style.setProperty('--ratio', ratio.replace(':','/'));
    document.querySelector('.title small').textContent = w+' × '+h+' · '+ratio;
    $('zreset').click();
    drawSoon();
  });
});

$('f').onchange=e=>{
  const r=e.target.files[0];if(!r)return;
  const i=new Image();
  i.onload=()=>{img=i;drawSoon();};
  i.src=URL.createObjectURL(r);
};

$('logoFile').onchange=e=>{
  const r=e.target.files[0];if(!r)return;
  const i=new Image();
  i.onload=()=>{logoImg=i;drawSoon();};
  i.src=URL.createObjectURL(r);
};

/* =========================================================
   LÓGICA AVANÇADA DE ARRASTAR E ZOOM (PAN & PINCH)
   ========================================================= */
let drag={active:false,target:null,sx:0,sy:0,ox0:0,oy0:0,lx0:0,ly0:0};
let pinch={active:false,startDist:0,startZoom:1};
function pinchDist(touches){return Math.hypot(touches[0].clientX-touches[1].clientX,touches[0].clientY-touches[1].clientY);}

c.addEventListener('pointerdown',e=>{
  if(pinch.active) return;
  drag.active=true;drag.sx=e.clientX;drag.sy=e.clientY;
  const rect=c.getBoundingClientRect();
  const px=(e.clientX-rect.left)/rect.width, py=(e.clientY-rect.top)/rect.height;
  drag.target='photo';

  if(logoImg && state.lvis==='on'){
    const lw=state.lw;
    const lh=lw * (logoImg.naturalHeight / logoImg.naturalWidth);
    const lx0=state.lx/100,ly0=state.ly/100;
    if(px>lx0-0.05 && px<lx0+state.lw/state.W+0.05 && py>ly0-0.05 && py<ly0+lh/state.H+0.05){
      drag.target='logo';
    }
  }

  if(drag.target==='photo'){drag.ox0=state.ox;drag.oy0=state.oy;}
  else{drag.lx0=state.lx;drag.ly0=state.ly;}
  try{c.setPointerCapture(e.pointerId);}catch(_){}
});

c.addEventListener('pointermove',e=>{
  if(!drag.active||pinch.active)return;
  const rect=c.getBoundingClientRect();
  const dx=(e.clientX-drag.sx)/rect.width, dy=(e.clientY-drag.sy)/rect.height;
  if(drag.target==='photo'){
    state.ox=Math.max(-3,Math.min(3,drag.ox0+dx*2));
    state.oy=Math.max(-3,Math.min(3,drag.oy0+dy*2));
    $('x').value=state.ox;$('y').value=state.oy;
  }else{
    state.lx=Math.max(0,Math.min(100,drag.lx0+dx*100));
    state.ly=Math.max(0,Math.min(100,drag.ly0+dy*100));
    $('lx').value=state.lx;$('ly').value=state.ly;
  }
  drawSoon();
});

c.addEventListener('pointerup',()=>{if(drag.active){drag.active=false;drag.target=null;}});
c.addEventListener('pointercancel',()=>{drag.active=false;drag.target=null;});

// Pinça
c.addEventListener('touchstart',e=>{
  if(e.touches.length===2){
    pinch.active=true;drag.active=false;
    pinch.startDist=pinchDist(e.touches);
    pinch.startZoom=state.zoom;

    const rect=c.getBoundingClientRect();
    const cx=(e.touches[0].clientX+e.touches[1].clientX)/2;
    const cy=(e.touches[0].clientY+e.touches[1].clientY)/2;
    pinch.px=(cx-rect.left)/rect.width;
    pinch.py=(cy-rect.top)/rect.height;
  }
},{passive:true});

c.addEventListener('touchmove',e=>{
  if(pinch.active&&e.touches.length===2){
    e.preventDefault();
    const d=pinchDist(e.touches);
    const newZoom = Math.max(0.5, Math.min(5, pinch.startZoom * (d / pinch.startDist)));

    const scaleRatio = newZoom / state.zoom;
    const cx = (pinch.px - 0.5) * 2;
    const cy = (pinch.py - 0.5) * 2;
    state.ox = Math.max(-3, Math.min(3, state.ox + (cx * (scaleRatio - 1) * 2)));
    state.oy = Math.max(-3, Math.min(3, state.oy + (cy * (scaleRatio - 1) * 2)));

    state.zoom = newZoom;
    $('z').value=state.zoom;
    $('x').value=state.ox;
    $('y').value=state.oy;
    drawSoon();
  }
},{passive:false});

c.addEventListener('touchend',e=>{
  if(pinch.active&&e.touches.length<2){pinch.active=false;}
},{passive:true});

// Mouse Wheel
c.addEventListener('wheel',e=>{
  e.preventDefault();
  const isTrackpad = Math.abs(e.deltaY) < 10;
  const speed = isTrackpad ? 0.015 : 0.002;
  const newZoom = Math.max(0.5, Math.min(5, state.zoom - e.deltaY * speed));

  const rect=c.getBoundingClientRect();
  const px=(e.clientX-rect.left)/rect.width;
  const py=(e.clientY-rect.top)/rect.height;
  const scaleRatio = newZoom / state.zoom;
  const cx = (px - 0.5) * 2;
  const cy = (py - 0.5) * 2;
  state.ox = Math.max(-3, Math.min(3, state.ox + (cx * (scaleRatio - 1) * 2)));
  state.oy = Math.max(-3, Math.min(3, state.oy + (cy * (scaleRatio - 1) * 2)));

  state.zoom = newZoom;
  $('z').value=state.zoom;
  $('x').value=state.ox;
  $('y').value=state.oy;
  drawSoon();
},{passive:false});

$('zreset').onclick=()=>{
  state.zoom=1;$('z').value=1;
  state.ox=0;$('x').value=0;
  state.oy=0;$('y').value=0;
  drawSoon();
};

// Exportar WebP
async function exportImg(){
  await draw();
  return new Promise(r=>{
    c.toBlob(b=>{
      if(b&&b.type==='image/webp')return r(b);
      c.toBlob(r,'image/png');
    },'image/webp',0.92);
  });
}
async function showOut(){
  const b=await exportImg();
  if(!b){alert('Não foi possível gerar a imagem.');return null;}
  const ext=b.type==='image/webp'?'webp':'png';
  const name='hairos-pin-'+state.ratio.replace(':','x')+'.'+ext;
  const u=URL.createObjectURL(b);
  $('out').src=u;$('out').style.display='block';$('hint').style.display='block';
  return {b,u,name};
}
$('dl').onclick=async()=>{
  const r=await showOut();if(!r)return;
  const a=document.createElement('a');a.download=r.name;a.href=r.u;
  document.body.appendChild(a);a.click();a.remove();
};
$('sh2').onclick=async()=>{
  const r=await showOut();if(!r)return;
  const f=new File([r.b],r.name,{type:r.b.type});
  if(navigator.canShare&&navigator.canShare({files:[f]})){
    try{await navigator.share({files:[f]});}catch(e){}
  }
};
$('rs').onclick=()=>{
  if(!confirm('Limpar tudo e recomeçar?'))return;
  location.reload();
};

// Inicializa o canvas com a proporção ativa
(function initRatio(){
  const activeBtn = document.querySelector('.ratio-btn.ativo');
  if(!activeBtn) return;
  state.W = +activeBtn.dataset.w;
  state.H = +activeBtn.dataset.h;
  state.ratio = activeBtn.dataset.ratio;
  c.width = state.W; c.height = state.H;
  document.documentElement.style.setProperty('--ratio', state.ratio.replace(':','/'));
  document.querySelector('.title small').textContent = state.W+' × '+state.H+' · '+state.ratio;
})();

draw();
</script>
